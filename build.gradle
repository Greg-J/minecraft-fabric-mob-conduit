plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mob-conduit" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// One uber-jar that loads on every platform: the Fabric jar (with the shared loader-neutral
// core and fabric.mod.json), the NeoForge adapter (neoforge.mods.toml, access transformer,
// reason-capture mixin), and the Bukkit plugin (plugin.yml — Paper reads it too, the jar ships
// no paper-plugin.yml). Shared classes
// appear in all three inputs and are byte-identical, so EXCLUDE dedups them. Each loader reads
// only its own descriptor and ignores the rest.
//
// Registered in afterEvaluate because Loom creates remapJar lazily; resolving the Fabric jar
// through the task provider beats hardcoding its output path.
afterEvaluate {
	tasks.register('mergeJar', Jar) {
		group = 'build'
		description = 'Merges the Fabric, NeoForge and Bukkit jars into one all-platform jar.'
		archiveBaseName = 'mob-conduit'
		archiveClassifier = 'all'
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE

		def fabricJar = tasks.named('jar')
		def neoForgeJar = project(':neoforge').tasks.named('jar')
		def bukkitJar = project(':bukkit').tasks.named('jar')

		dependsOn fabricJar, neoForgeJar, bukkitJar

		from({ zipTree(fabricJar.get().archiveFile) })
		from({ zipTree(neoForgeJar.get().archiveFile) })
		from({ zipTree(bukkitJar.get().archiveFile) })

		doLast {
			// A missing descriptor silently degrades the uber-jar to a subset of platforms.
			def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
			try {
				['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'plugin.yml'].each { name ->
					if (zip.getEntry(name) == null) {
						throw new GradleException("uber-jar is missing $name")
					}
				}
			} finally {
				zip.close()
			}
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

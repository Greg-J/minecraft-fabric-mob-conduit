// Bukkit platform module. Re-implements the mod against the pure Bukkit API (Paper first,
// Spigot-compatible). See docs/superpowers/specs/2026-08-02-multi-loader-design.md §3.
plugins {
	id 'java-library'
}

// Same version as the root (Fabric) project: gradle.properties mod_version.
version = rootProject.version

repositories {
	maven { url = 'https://repo.papermc.io/repository/maven-public/' }
	maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
	mavenCentral()
}

// Two source sets with deliberately different compile classpaths. main compiles against
// spigot-api alone — so any unguarded Paper-only reference is a build error, not a Spigot
// runtime surprise. The paper source set compiles against paper-api and holds the Paper-only
// implementations, which main code instantiates reflectively (see PaperAccess / ActionBars).
sourceSets {
	paper {
		java.srcDir 'src/paper/java'
		compileClasspath += sourceSets.main.output
	}
}

dependencies {
	compileOnly 'org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT'
	paperCompileOnly 'io.papermc.paper:paper-api:26.2.build.91-stable'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

processResources {
	def projectVersion = project.version
	inputs.property 'version', projectVersion

	filesMatching(['plugin.yml', 'paper-plugin.yml']) {
		expand 'version': projectVersion
	}
}

jar {
	archiveBaseName = 'mob-conduit-bukkit'

	from("$rootDir/LICENSE") {
		rename { "${it}_mob-conduit" }
	}

	// The Paper-only implementations (loaded reflectively behind runtime checks).
	from sourceSets.paper.output
}

name: MobConduit
version: ${version}
main: io.github.gregj.mobconduit.bukkit.MobConduitPlugin
api-version: '26.2'
description: A player-built multiblock that suppresses natural hostile spawning in a radius, built entirely from vanilla blocks. Server-side only; vanilla clients connect unmodified.
author: gregj
commands:
  mobconduit:
    description: Mob Conduit administration.
    usage: /mobconduit <reload|status|sweep|set|get|build|visualize>
    permission: mobconduit.admin
permissions:
  mobconduit.admin:
    description: Mob Conduit admin commands.
    default: op
